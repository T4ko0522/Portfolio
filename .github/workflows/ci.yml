name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Check / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: nix develop --command bun run check

      - name: Test
        run: nix develop --command bun run test

      - name: Build
        run: nix develop --command bun run build
